# config.toml — `cp config.example.toml config.toml` 후 수정해서 쓰세요.

[comfy]
url = "http://127.0.0.1:8188"
workflow = "workflows/wan22_i2v_gguf_api.json"
timeout = 3600.0        # 클립 하나가 이 시간을 넘으면 중단
poll_interval = 2.0

[models]
# ComfyUI에 실제로 설치된 파일명과 정확히 일치해야 합니다 (`python -m i2v check`로 확인).
high_noise = "wan2.2_i2v_high_noise_14B_Q4_K_M.gguf"
low_noise  = "wan2.2_i2v_low_noise_14B_Q4_K_M.gguf"
clip       = "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
vae        = "wan_2.1_vae.safetensors"

[video]
width  = 480            # 16의 배수. 세로 숏폼 480p. 12GB에서 720x1280은 빠듯합니다.
height = 832
fps    = 16             # Wan 2.2의 학습 프레임레이트
clip_frames = 81        # 4n+1. 81프레임 @16fps → 겹침 1장 제외하고 정확히 5.0초
target_seconds = 300.0
trim_overlap = true     # 클립 경계에서 중복 프레임 1장 제거

[sampling]
steps = 20
cfg = 3.5
sampler = "euler"
scheduler = "simple"
shift = 8.0
boundary = 0.5          # 스텝의 앞 50%는 high-noise, 뒤 50%는 low-noise 전문가
seed = 12345
seed_mode = "increment" # increment | fixed | random

[speed]
# Lightning / LightX2V 계열 distill LoRA. 켜면 6스텝·cfg 1.0으로 3~4배 빨라집니다.
# 모션 다이내믹이 다소 줄어드는 대신 60클립 배치가 하룻밤에 끝납니다.
enabled = false
high_lora = "wan2.2_i2v_lightx2v_4step_lora_high.safetensors"
low_lora  = "wan2.2_i2v_lightx2v_4step_lora_low.safetensors"
strength = 1.0
steps = 6
cfg = 1.0

[chain]
color_anchor = 0.6      # 0.0~1.0. 이어붙일수록 밀리는 색을 샷 키프레임 쪽으로 되돌림
reset_every = 0         # 0 = 하드 리셋 없음. N > 0이면 N클립마다 키프레임으로 복귀 (루프용)
negative = "색조 왜곡, 정지 화면, 흐릿함, 디테일 뭉개짐, 자막, 워터마크, 로고, 손가락 기형, 저화질, JPEG 아티팩트, 밝기 깜빡임, 급격한 장면 전환"

[paths]
work = "work"           # 중간 산출물 + 재개용 state.json
out  = "out"

# ── 샷 리스트 ────────────────────────────────────────────────────────────
# clips 합계 × 5.0초 = 최종 길이. 아래는 10샷 × 6클립 = 60클립 = 300초.
# keyframe이 있으면 그 이미지에서 새로 시작하고, 없으면 앞 샷의 끝프레임에서 이어집니다.
# 한 샷을 6클립(30초) 이하로 유지하면 체이닝 드리프트가 눈에 띄지 않습니다.

[[shots]]
keyframe = "images/01_dawn.png"
clips = 6
prompt = "새벽 안개가 깔린 호숫가, 수면 위로 옅은 물안개가 천천히 흐른다. 카메라가 아주 느리게 전진한다. 시네마틱 조명, 얕은 심도"

